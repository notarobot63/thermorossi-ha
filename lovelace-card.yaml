# Thermorossi card - Bubble Card + Mushroom
# Requires (HACS frontend): Bubble Card, Mushroom Cards, Card Mod
#
# Entity IDs are the French ones (HA in French when the integration was added).
# See the header of automations.yaml / the README for the English equivalents.

type: vertical-stack
cards:

  # ── 1. Main button ───────────────────────────────────────────
  - type: custom:bubble-card
    card_type: button
    entity: switch.thermorossi_poele
    name: Thermorossi Stove
    icon: mdi:fire
    show_state: false
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    sub_button:
      - entity: sensor.thermorossi_etat
        show_state: true
        show_icon: false
        tap_action:
          action: none
      - entity: number.thermorossi_niveau_de_puissance
        icon: mdi:fire
        show_state: true
        show_icon: true
        tap_action:
          action: more-info
      - entity: number.thermorossi_vitesse_ventilateur
        icon: mdi:fan
        show_state: true
        show_icon: true
        tap_action:
          action: more-info
    styles: |
      .bubble-icon {
        {% set s = states('sensor.thermorossi_etat') %}
        {% if s == 'stop' %}
          color: rgb(211,47,47) !important;
        {% elif s == 'work' %}
          color: rgb(230,81,0) !important;
        {% elif s == 'start' %}
          color: rgb(251,140,0) !important;
        {% elif s in ['temp_ok', 'wait_on'] %}
          color: rgb(255,193,7) !important;
        {% else %}
          color: var(--secondary-text-color) !important;
        {% endif %}
      }

  # ── 2. Alarm banner (visible only when an alert is active) ───
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity: binary_sensor.thermorossi_alarme
            state: "on"
          - condition: state
            entity: binary_sensor.thermorossi_arret_erreur
            state: "on"
          - condition: state
            entity: binary_sensor.thermorossi_pellets_insuffisants
            state: "on"
    card:
      type: custom:mushroom-template-card
      primary: >
        {% if is_state('binary_sensor.thermorossi_arret_erreur', 'on') %}
          🛑 Stove stopped - {{ state_translated('sensor.thermorossi_message_alarme') }}
        {% elif is_state('binary_sensor.thermorossi_alarme', 'on') %}
          ⚠️ {{ state_translated('sensor.thermorossi_message_alarme') }}
        {% elif is_state('binary_sensor.thermorossi_pellets_insuffisants', 'on') %}
          ⚠️ Pellet reserve empty
        {% endif %}
      secondary: >
        {% if is_state('binary_sensor.thermorossi_arret_erreur', 'on') %}
          Check burner or pellets, then turn the stove off to acknowledge
        {% elif is_state('binary_sensor.thermorossi_pellets_insuffisants', 'on') %}
          Refill the pellet hopper
        {% endif %}
      icon: >
        {% if is_state('binary_sensor.thermorossi_arret_erreur', 'on') %}
          mdi:fire-alert
        {% else %}
          mdi:alert-circle
        {% endif %}
      icon_color: red
      layout: horizontal
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(135deg,
              rgba(211,47,47,0.15) 0%,
              rgba(183,28,28,0.08) 100%);
            border: 1.5px solid rgba(211,47,47,0.4);
            padding: 8px 16px;
          }

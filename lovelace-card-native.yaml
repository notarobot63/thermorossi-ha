# Thermorossi card - 100% native HA (tile cards)
# No custom cards required
#
# Entity IDs are the French ones (HA in French when the integration was added).
# See the header of automations.yaml / the README for the English equivalents.

type: vertical-stack
cards:

  # ── 1. Main switch ───────────────────────────────────────────
  - type: tile
    entity: switch.thermorossi_poele
    name: Thermorossi Stove
    icon: mdi:fire
    color: deep-orange
    features:
      - type: toggle

  # ── 2. Power level + Fan speed ───────────────────────────────
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: number.thermorossi_niveau_de_puissance
        name: Power
        icon: mdi:fire
        color: deep-orange
        features:
          - type: numeric-input
            style: slider
      - type: tile
        entity: number.thermorossi_vitesse_ventilateur
        name: Fan
        icon: mdi:fan
        color: blue
        features:
          - type: numeric-input
            style: slider

  # ── 3. Temperature setpoint ──────────────────────────────────
  - type: tile
    entity: number.thermorossi_consigne_temperature
    name: Setpoint
    icon: mdi:thermometer
    color: red
    features:
      - type: numeric-input
        style: buttons

  # ── 4. Alarm banners (visible only when an alert is active) ──
  # Tile names are static text (no templates): the alarm tiles show the
  # alarm message sensor, whose state is translated by Home Assistant.
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.thermorossi_arret_erreur
        state: "on"
    card:
      type: tile
      entity: sensor.thermorossi_message_alarme
      name: Stove stopped (turn off to acknowledge)
      icon: mdi:fire-alert
      color: red

  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.thermorossi_alarme
        state: "on"
      - condition: state
        entity: binary_sensor.thermorossi_arret_erreur
        state: "off"
    card:
      type: tile
      entity: sensor.thermorossi_message_alarme
      name: Alarm
      icon: mdi:alert-circle
      color: red

  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.thermorossi_pellets_insuffisants
        state: "on"
    card:
      type: tile
      entity: binary_sensor.thermorossi_pellets_insuffisants
      name: Pellet reserve empty - refill the hopper
      icon: mdi:grain
      color: red

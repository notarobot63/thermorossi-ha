# Thermorossi — Automations (Signal notifications via SignalMe)
#
# Prerequisites — add to configuration.yaml:
#
#   rest_command:
#     signal_notify:
#       url: "http://<signalme-host>:<port>/webhook/<source-slug>"
#       method: POST
#       content_type: "application/json"
#       payload: '{"message": "{{ message }}"}'

# ─────────────────────────────────────────────────────────────────
# 1. GENERAL ALARM (any alarm bit set — reg[8]+reg[9])
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Alarm active"
  id: thermorossi_alarm_active
  trigger:
    - platform: state
      entity_id: binary_sensor.thermorossi_alarme
      to: "on"
  action:
    - service: rest_command.signal_notify
      data:
        message: >-
          🔥 Thermorossi — Alarm: {{ states('sensor.thermorossi_message_alarme') }}

# ─────────────────────────────────────────────────────────────────
# 2. ERROR STOP (STOP state — reg[6]=8)
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Error stop"
  id: thermorossi_stop_error
  trigger:
    - platform: state
      entity_id: binary_sensor.thermorossi_arret_erreur
      to: "on"
  action:
    - service: rest_command.signal_notify
      data:
        message: >-
          🛑 Thermorossi — Stove stopped on error.
          Alarm: {{ states('sensor.thermorossi_message_alarme') }}

# ─────────────────────────────────────────────────────────────────
# 3. PELLETS LOW
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Pellets low"
  id: thermorossi_pellets_low
  trigger:
    - platform: state
      entity_id: binary_sensor.thermorossi_pellets_insuffisants
      to: "on"
  action:
    - service: rest_command.signal_notify
      data:
        message: "🪵 Thermorossi — Pellet reserve empty. Refill the hopper."

# ─────────────────────────────────────────────────────────────────
# 4. STUCK IGNITION — clogged burner (START for 25 min)
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Stuck ignition"
  id: thermorossi_stuck_start
  trigger:
    - platform: state
      entity_id: sensor.thermorossi_etat
      to: "start"
      for:
        minutes: 25
  condition:
    - condition: state
      entity_id: sensor.thermorossi_etat
      state: "start"
  action:
    - service: rest_command.signal_notify
      data:
        message: "⚠️ Thermorossi — Ignition stuck for 25 min. Burner may need cleaning."

# ─────────────────────────────────────────────────────────────────
# 5. UNEXPECTED SHUTDOWN DURING HEATING
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Unexpected shutdown"
  id: thermorossi_unexpected_stop
  trigger:
    - platform: state
      entity_id: sensor.thermorossi_etat
      from: "work"
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.state in ['off', 'stop'] }}
  action:
    - service: rest_command.signal_notify
      data:
        message: >-
          ⚠️ Thermorossi — Stove stopped during heating ({{ trigger.to_state.state }}).
          {% if states('binary_sensor.thermorossi_pellets_insuffisants') == 'on' %}Pellets exhausted.
          {% elif states('binary_sensor.thermorossi_alarme') == 'on' %}Alarm: {{ states('sensor.thermorossi_message_alarme') }}
          {% else %}Check stove status.{% endif %}

# ─────────────────────────────────────────────────────────────────
# 6. HEATING STARTED (optional — confirms successful ignition)
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Heating started"
  id: thermorossi_work_started
  trigger:
    - platform: state
      entity_id: sensor.thermorossi_etat
      to: "work"
  action:
    - service: rest_command.signal_notify
      data:
        message: >-
          ✅ Thermorossi — Heating. Power level {{ states('sensor.thermorossi_niveau_de_puissance') }}/5.

# ─────────────────────────────────────────────────────────────────
# 7. ALARM CLEARED
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Alarm cleared"
  id: thermorossi_alarm_cleared
  trigger:
    - platform: state
      entity_id: binary_sensor.thermorossi_alarme
      to: "off"
      from: "on"
  action:
    - service: rest_command.signal_notify
      data:
        message: "✅ Thermorossi — Alarm cleared. Stove ready."

# Thermorossi - Automations (Signal notifications via SignalMe)
#
# Requires Home Assistant 2024.10+ (triggers/actions syntax, state_translated).
#
# Entity IDs below are the ones generated when Home Assistant runs in FRENCH.
# They depend on the language HA was set to when the integration was added:
#
#   French (below)                                English
#   binary_sensor.thermorossi_alarme              binary_sensor.thermorossi_alarm
#   binary_sensor.thermorossi_arret_erreur        binary_sensor.thermorossi_error_stop
#   binary_sensor.thermorossi_pellets_insuffisants binary_sensor.thermorossi_pellets_low
#   sensor.thermorossi_message_alarme             sensor.thermorossi_alarm_message
#   sensor.thermorossi_etat                       sensor.thermorossi_state
#
# Check yours in Settings → Devices & services → Thermorossi.
#
# Prerequisites - add to configuration.yaml:
#
#   rest_command:
#     signal_notify:
#       url: "http://<signalme-host>:<port>/webhook/<source-slug>"
#       method: POST
#       content_type: "application/json"
#       payload: '{"message": "{{ message }}"}'

# ─────────────────────────────────────────────────────────────────
# 1. GENERAL ALARM (any alarm bit set - reg[8]+reg[9])
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Alarm active"
  id: thermorossi_alarm_active
  triggers:
    - trigger: state
      entity_id: binary_sensor.thermorossi_alarme
      to: "on"
  actions:
    - action: rest_command.signal_notify
      data:
        message: >-
          🔥 Thermorossi - Alarme : {{ state_translated('sensor.thermorossi_message_alarme') }}

# ─────────────────────────────────────────────────────────────────
# 2. ERROR STOP (STOP state - reg[6]=8)
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Error stop"
  id: thermorossi_stop_error
  triggers:
    - trigger: state
      entity_id: binary_sensor.thermorossi_arret_erreur
      to: "on"
  actions:
    - action: rest_command.signal_notify
      data:
        message: >-
          🛑 Thermorossi - Poêle arrêté sur erreur.
          Alarme : {{ state_translated('sensor.thermorossi_message_alarme') }}.
          Éteignez le poêle pour acquitter l'alarme après vérification.

# ─────────────────────────────────────────────────────────────────
# 3. PELLETS LOW
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Pellets low"
  id: thermorossi_pellets_low
  triggers:
    - trigger: state
      entity_id: binary_sensor.thermorossi_pellets_insuffisants
      to: "on"
  actions:
    - action: rest_command.signal_notify
      data:
        message: "🪵 Thermorossi - Réserve de pellets vide. Remplissez le bac."

# ─────────────────────────────────────────────────────────────────
# 4. STUCK IGNITION - clogged burner (START → STOP without reaching work)
# ─────────────────────────────────────────────────────────────────
- alias: "Thermorossi - Stuck ignition"
  id: thermorossi_stuck_start
  triggers:
    - trigger: state
      entity_id: sensor.thermorossi_etat
      from: "start"
      to: "stop"
  actions:
    - action: rest_command.signal_notify
      data:
        message: "⚠️ Thermorossi - Allumage échoué. Le brûleur doit être nettoyé."
